<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Clipboard Extractor</title>
    <link rel="stylesheet" href="styles.css" />
    <style>
      body { width: 320px; padding: 14px; }
      header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 12px; }
      h1 { font-size: 15px; margin: 0; }
      .stats { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 12px; }
      .stat { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 8px 10px; }
      .stat b { display: block; font-size: 20px; }
      .stat span { font-size: 12px; color: var(--muted); }
      .actions { display: grid; gap: 8px; }
      .recent { margin-top: 12px; font-size: 12px; }
      .recent div { padding: 4px 0; border-top: 1px solid var(--border); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
      #msg { min-height: 1em; font-size: 12px; margin-top: 8px; }
    </style>
  </head>
  <body>
    <header>
      <h1>Clipboard Extractor</h1>
      <label class="switch" title="Watch the clipboard"><input type="checkbox" id="enabled" /><span id="enabledLabel">On</span></label>
    </header>
    <div class="stats">
      <div class="stat"><b id="rowCount">0</b><span>rows in table</span></div>
      <div class="stat"><b id="lastCount">–</b><span id="lastAt">last capture</span></div>
    </div>
    <div class="actions">
      <button class="primary" id="open">Open table</button>
      <button id="capture" title="Process the current clipboard now, even if it was already seen">Capture clipboard now</button>
    </div>
    <div id="msg" class="muted"></div>
    <div class="recent" id="recent"></div>
    <script src="lib/extractor.js"></script>
    <script src="lib/storage.js"></script>
    <script src="popup.js"></script>
  </body>
</html>
